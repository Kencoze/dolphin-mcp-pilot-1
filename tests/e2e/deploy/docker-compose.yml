# =============================================================================
# Docker Compose for E2E testing
# =============================================================================
# Uses DolphinScheduler standalone server (all-in-one) for fast startup.
# Both services are accessible on localhost for the pytest suite.
#
# Usage:
#   docker compose -f tests/e2e/deploy/docker-compose.yml up -d
#   docker compose -f tests/e2e/deploy/docker-compose.yml down -v
# =============================================================================

services:
  # DolphinScheduler standalone (all-in-one: API + Master + Worker + DB)
  dolphinscheduler:
    image: apache/dolphinscheduler-standalone-server:${DS_VERSION:-3.4.2}
    container_name: e2e-dolphinscheduler
    environment:
      TZ: Asia/Shanghai
      # Optimized JVM settings for faster startup in resource-constrained environments
      JAVA_OPTS: >-
        -server
        -Xms256m
        -Xmx1536m
        -Xmn128m
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -XX:+IgnoreUnrecognizedVMOptions
        -XX:+ExitOnOutOfMemoryError
        -DDOCKER=true
      # Disable overload protection to prevent startup failures in CI/local environments
      # DS default thresholds (80% CPU/memory) are too aggressive for constrained environments
      MASTER_SERVER_LOAD_PROTECTION_ENABLED: "false"
      WORKER_SERVER_LOAD_PROTECTION_ENABLED: "false"
      # Reduce thread pool sizes for faster startup
      MASTER_EXEC_THREAD_NUM: "10"
      MASTER_KILL_APPLICATION_WHEN_HANDLE_FAILOVER: "false"
      WORKER_EXEC_THREADS: "10"
      WORKER_FETCH_COMMAND_NUM: "1"
    ports:
      - "${E2E_DS_PORT:-12345}:12345"
    healthcheck:
      # Check actual API endpoint, not just static UI files
      # Increased start_period to allow for slower startup in constrained environments
      test: ["CMD", "curl", "-sf", "-X", "POST", "http://localhost:12345/dolphinscheduler/login", "-d", "userName=admin&userPassword=dolphinscheduler123"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 300s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G

  # Dolphin MCP Pilot
  dolphin-mcp-pilot:
    build:
      context: ../../..
      dockerfile: Dockerfile
    container_name: e2e-dolphin-mcp-pilot
    environment:
      DS_URL: http://dolphinscheduler:12345/dolphinscheduler
      DS_USER: admin
      DS_PASSWORD: dolphinscheduler123
      MCP_PORT: "8001"
    ports:
      - "${E2E_PILOT_PORT:-18001}:8001"
    depends_on:
      dolphinscheduler:
        condition: service_healthy
    healthcheck:
      # Verify MCP HTTP endpoint is responding with a tools/list request
      # Must include Accept header for MCP 2.0 stateless protocol
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request, json
          req = urllib.request.Request(
            'http://127.0.0.1:8001/mcp/',
            data=json.dumps({'jsonrpc': '2.0', 'id': 1, 'method': 'tools/list', 'params': {}}).encode(),
            headers={
              'Content-Type': 'application/json',
              'Accept': 'application/json, text/event-stream'
            },
            method='POST'
          )
          resp = urllib.request.urlopen(req, timeout=5)
          exit(0 if resp.status == 200 else 1)
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
